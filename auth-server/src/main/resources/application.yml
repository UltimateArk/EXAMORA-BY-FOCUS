server:
  port: 8081

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/examora_auth}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-256-bit-minimum-secret-key-0123456789abcdef}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    com.examora.auth: INFO
    org.hibernate.SQL: WARN
